{% extends "base.html" %}

{% block title %}Sign In — MessFlow{% endblock %}

{% block body %}
<div class="auth-wrapper">
  <div class="auth-inner">
    
    <!-- BRAND HERO -->
    <div class="auth-hero">
      <div class="auth-hero-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
      </div>
      <h1 class="auth-hero-title">Mess<span>Flow</span></h1>
      <p class="auth-hero-desc">Hostel Mess Management &amp; Dining Portal</p>
    </div>

    <!-- AUTH CARD -->
    <div class="card auth-card">
      <div class="auth-card-head">
        <h2 class="auth-card-title">Sign In</h2>
        <p class="auth-card-subtitle">Enter your User ID and Password to continue.</p>
      </div>

      <!-- FORM -->
      <form method="post" id="authForm" action="{{ url_for('login') }}">
        <div class="auth-input-group">
          <label for="emailInput">User ID</label>
          <input type="text" id="emailInput" name="email" required placeholder="User ID" autocomplete="username">
        </div>

        <div class="auth-input-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" name="password" required placeholder="Password" autocomplete="current-password">
        </div>

        <div class="auth-btn-group">
          <button type="submit" class="btn btn-primary auth-submit-btn">
            Sign In
          </button>
        </div>
      </form>
    </div>

    <!-- FOOTER INFO -->
    <div class="auth-footer-text">
      Hostel Mess Management System
    </div>

  </div>
</div>
{% endblock %}
